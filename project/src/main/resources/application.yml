spring:
  application:
    name: irp-core

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/irp}
    username: ${DB_USERNAME:irp}
    password: ${DB_PASSWORD:irp}
    hikari:
      maximum-pool-size: 10

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: always
    include-binding-errors: always

irp:
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-change-me-please-32bytes-min}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:60}
    issuer: irp-core
  apikey:
    prefix: irp_live_

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

logging:
  level:
    root: INFO
    com.irp.core: DEBUG
    org.hibernate.SQL: WARN
